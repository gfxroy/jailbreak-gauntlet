# One-command start:  docker compose up --build   ->  http://localhost:8080
# Runs in offline demo mode unless OPENAI_API_KEY is set in .env.
services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/gauntlet.db
    volumes:
      - gauntlet-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  gauntlet-data:
